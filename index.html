<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Inspection Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Vehicle Inspection Dashboard</h1>
        <p class="text-sm text-gray-500 mt-1">Manage and review fleet inspection logs synced with Google Sheets.</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fetchRecordsFromSheets()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          Sync with Sheets
        </button>
      </div>
    </header>

    <!-- History Section -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-800">Inspection History</h2>
        <span id="recordCount" class="text-xs font-medium bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full">0 Records</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-200">
              <th class="py-3 px-4 font-semibold">ID</th>
              <th class="py-3 px-4 font-semibold">Date</th>
              <th class="py-3 px-4 font-semibold">Reg No</th>
              <th class="py-3 px-4 font-semibold">Vehicle Type</th>
              <th class="py-3 px-4 font-semibold">Location</th>
              <th class="py-3 px-4 font-semibold">Officer</th>
              <th class="py-3 px-4 font-semibold text-center">Status (Good/Bad)</th>
              <th class="py-3 px-4 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-gray-200 text-sm">
            <tr>
              <td colspan="8" class="text-center py-6 text-gray-400">Loading records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Replace with your deployed Google Apps Script Web App URL
    const DEFAULT_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
    let inspectionHistory = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchRecordsFromSheets();
    });

    // Fetch records from Google Sheets database
    async function fetchRecordsFromSheets() {
      const webAppUrl = localStorage.getItem('sheetsUrl') || DEFAULT_WEB_APP_URL;
      if (!webAppUrl || webAppUrl.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        console.warn("Google Apps Script Web App URL is not set.");
        loadFromLocalStorage();
        return;
      }

      try {
        const response = await fetch(webAppUrl);
        const data = await response.json();
        
        if (Array.isArray(data)) {
          inspectionHistory = data;
          localStorage.setItem('inspectionHistory', JSON.stringify(inspectionHistory));
          renderHistoryTable();
        } else {
          console.error("Invalid data format received from Sheets:", data);
          loadFromLocalStorage();
        }
      } catch (error) {
        console.error("Error fetching from Sheets:", error);
        loadFromLocalStorage();
      }
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem('inspectionHistory');
      if (saved) {
        try {
          inspectionHistory = JSON.parse(saved);
        } catch (e) {
          inspectionHistory = [];
        }
      }
      renderHistoryTable();
    }

    // Render data into the HTML table UI
    function renderHistoryTable() {
      const tbody = document.getElementById('historyTableBody');
      const countBadge = document.getElementById('recordCount');
      
      countBadge.textContent = `${inspectionHistory.length} Record${inspectionHistory.length === 1 ? '' : 's'}`;
      
      if (inspectionHistory.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-gray-400">No inspection records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = inspectionHistory.map(record => `
        <tr class="hover:bg-gray-50 transition">
          <td class="py-3 px-4 font-medium text-gray-900">${record.id || 'N/A'}</td>
          <td class="py-3 px-4 text-gray-600">${record.date || record.inspectionDate || 'N/A'}</td>
          <td class="py-3 px-4 font-semibold text-indigo-600">${record.regNo || 'N/A'}</td>
          <td class="py-3 px-4 text-gray-600">${record.vehicleType || 'N/A'}</td>
          <td class="py-3 px-4 text-gray-600">${record.location || 'N/A'}</td>
          <td class="py-3 px-4 text-gray-600">${record.officerName || 'N/A'}</td>
          <td class="py-3 px-4 text-center">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 mr-1">
              ${record.goodCount || 0} Good
            </span>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">
              ${record.badCount || 0} Bad
            </span>
          </td>
          <td class="py-3 px-4 text-right space-x-2">
            <button onclick="removeRecord('${record.id}')" class="text-red-600 hover:text-red-900 font-medium text-xs bg-red-50 hover:bg-red-100 px-2.5 py-1.5 rounded transition">
              Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    // Fully integrated frontend delete function
    async function removeRecord(targetId) {
      if (!confirm("Are you sure you want to remove this inspection record from both the UI and Google Sheets?")) {
        return;
      }

      const webAppUrl = localStorage.getItem('sheetsUrl') || DEFAULT_WEB_APP_URL;

      try {
        const response = await fetch(webAppUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'delete',
            id: targetId
          })
        });

        const result = await response.json();

        if (result && (result.status === 'success' || result.result === 'success')) {
          // Filter out the deleted item locally and refresh cache
          inspectionHistory = inspectionHistory.filter(r => r.id !== targetId);
          localStorage.setItem('inspectionHistory', JSON.stringify(inspectionHistory));
          
          renderHistoryTable();
          alert("Record successfully deleted from database and UI.");
        } else {
          alert("Failed to delete record: " + (result.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Deletion Error:', error);
        alert('Connection error while trying to delete the record.');
      }
    }
  </script>
</body>
</html>
